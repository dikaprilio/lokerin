name: Deploy backend ke evergarden

# Typecheck dan build di setiap PR dan push ke main, lalu deploy ke evergarden
# lewat SSH. Kunci SSH-nya dibatasi forced command ke lokerin-backend-deploy di
# server, jadi kunci ini hanya bisa memicu deploy. Jangan deploy saat penjurian:
# restart memutus panggilan suara yang sedang berjalan.
on:
  push:
    branches: [main]
    paths: ["src/**", "drizzle/**", "package.json", "pnpm-lock.yaml", "Dockerfile", ".github/workflows/deploy.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEPLOY_HOST: 20.214.144.24
  DEPLOY_USER: aliceevr
  # Kunci host publik evergarden (bukan rahasia), dari ssh-keyscan.
  DEPLOY_KNOWN_HOST: "20.214.144.24 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEjJjZ77h9hU8c4EN9f303jMedGLrQbRzXn1Ojyf9tYa"
  API_URL: https://api-lokerin.yorhagarden.xyz

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    steps:
      - name: Siapkan SSH
        env:
          SSH_KEY: ${{ secrets.EVERGARDEN_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Secret EVERGARDEN_SSH_KEY belum diisi. Lihat bagian Deploy di README."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOST" > ~/.ssh/known_hosts

      - name: Deploy
        run: ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST"

      - name: Cek /healthz publik
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "$API_URL/healthz"; then exit 0; fi
            sleep 5
          done
          exit 1
